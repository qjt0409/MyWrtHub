name: Build APK

# 推送到 main 或手动触发时,云端打包 debug APK 并存为构建产物(Artifacts)。
# 本仓库不含 gradle-wrapper.jar(纯文本源码管理),改用 setup-gradle 提供
# 与 gradle/wrapper/gradle-wrapper.properties 相同的 Gradle 8.11.1。
# 本地开发可用 Android Studio 打开,或先 `gradle wrapper` 生成 wrapper 再 ./gradlew。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests + assemble debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWrtHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
