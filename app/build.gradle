plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.whykangkang.wrthub'
    compileSdk 35

    defaultConfig {
        applicationId "com.qjt0409.mywrthub"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "1.11"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 正式签名:密钥不进仓库,CI 从 Secrets 解码出 keystore 文件后
    // 通过环境变量 RELEASE_KEYSTORE_PATH / RELEASE_STORE_PASSWORD 注入;
    // 环境变量缺失时 release 构建会因找不到签名文件失败(防止误发未签名包),
    // debug 构建不受影响。
    signingConfigs {
        release {
            storeFile file(System.getenv("RELEASE_KEYSTORE_PATH") ?: "no-keystore.keystore")
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias "mywrthub"
            keyPassword System.getenv("RELEASE_STORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.okhttp
    implementation libs.gson
    implementation libs.security.crypto
    implementation libs.mpandroidchart
    implementation libs.swiperefreshlayout
    implementation libs.play.review
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}